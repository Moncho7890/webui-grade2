<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじ — Weather Fortune</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="sakura-container" id="sakura"></div>

  <div class="page">

    <header>
      <div class="torii">⛩</div>
      <h1>おみくじ</h1>
      <p class="subtitle">Weather Fortune Slip</p>
    </header>

    <div class="lanterns">
      <div class="lantern lantern--red">
        <div class="lantern-body">運</div>
      </div>
      <div class="lantern lantern--gold">
        <div class="lantern-body">福</div>
      </div>
      <div class="lantern lantern--red">
        <div class="lantern-body">縁</div>
      </div>
    </div>

    <div class="input-section">
      <label for="cityInput">都市名を入力してください</label>
      <div class="input-row">
        <input type="text" id="cityInput" placeholder="Osaka, Tokyo, Kyoto..." value="Osaka" />
        <button id="drawBtn" onclick="fetchAndFortune()">引く</button>
      </div>
    </div>

    <div id="weatherCard" class="weather-card hidden">
      <div id="weatherIcon" class="weather-icon"></div>
      <div class="weather-info">
        <div id="weatherCity" class="weather-city"></div>
        <div id="weatherTemp" class="weather-temp"></div>
        <div id="weatherDesc" class="weather-desc"></div>
        <div id="weatherMeta" class="weather-meta"></div>
      </div>
    </div>

    <div id="slip" class="slip hidden">
      <div class="slip-ornament top"></div>
      <div class="slip-header">
        <span class="slip-label">御神籤</span>
        <span id="fortuneLevel" class="fortune-level"></span>
      </div>
      <div class="divider"><span>✦</span></div>
      <p id="fortuneMain" class="fortune-main"></p>
      <div class="divider"><span>✦</span></div>
      <div id="fortuneSections" class="fortune-sections"></div>
      <div class="slip-footer">心を静めて、ご縁を大切に</div>
      <div class="slip-ornament bottom"></div>
    </div>

    <div id="error" class="error hidden"></div>

    <footer>Open-Meteo API &nbsp;·&nbsp; 良いご縁がありますように</footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
